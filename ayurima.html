<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Rajdhani','Segoe UI',sans-serif;color:#c9b8ff;}
#c{display:block;width:100vw;height:100vh;}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#hud{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;pointer-events:none;}
.hres{background:rgba(10,5,20,.82);border:1px solid #2d1f5e;border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700;font-family:'Share Tech Mono',monospace;}
#ess{color:#a78bfa;}#pop{color:#34d399;}#wave{color:#f59e0b;}
#panel{position:fixed;bottom:10px;left:10px;width:220px;max-height:75vh;overflow-y:auto;background:rgba(6,2,18,.92);border:1px solid #1a0f3a;border-radius:10px;padding:8px;pointer-events:all;scrollbar-width:thin;scrollbar-color:#2d1f5e #06020f;}
#panel::-webkit-scrollbar{width:4px;}#panel::-webkit-scrollbar-track{background:#06020f;}#panel::-webkit-scrollbar-thumb{background:#2d1f5e;}
#ifo{position:fixed;bottom:10px;right:150px;width:195px;background:rgba(6,2,18,.92);border:1px solid #1a0f3a;border-radius:10px;padding:8px;pointer-events:none;font-size:11px;}
#log{position:fixed;top:44px;right:10px;width:190px;max-height:120px;overflow:hidden;pointer-events:none;}
.logm{font-size:10px;background:rgba(0,0,0,.6);border-left:2px solid #7c3aed;padding:2px 6px;margin-bottom:2px;border-radius:0 4px 4px 0;opacity:1;transition:opacity 1s;}
#menu,#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a0420 0%,#000 100%);z-index:100;}

#menu{background:transparent;}
.holo-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(20,8,48,.25) 0%,rgba(2,1,10,.78) 70%,rgba(0,0,0,.94) 100%);}
.scanlines{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(124,58,237,.045) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:screen;}
.vignette{position:fixed;inset:0;z-index:91;pointer-events:none;box-shadow:inset 0 0 220px 40px rgba(0,0,0,.85);}

.corner.tl{top:22px;left:22px;border-right:none;border-bottom:none;}
.corner.tr{top:22px;right:22px;border-left:none;border-bottom:none;}
.corner.bl{bottom:22px;left:22px;border-right:none;border-top:none;}
.corner.br{bottom:22px;right:22px;border-left:none;border-top:none;}
#menu .topbar{position:fixed;top:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:#5b4a8f;z-index:101;}
#menu .topbar .dot{width:6px;height:6px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;animation:pulse 1.6s infinite;}

.holo-line{width:160px;height:1px;background:linear-gradient(90deg,transparent,rgba(124,58,237,.6),transparent);}
h1{font-family:'Orbitron',sans-serif;font-size:74px;font-weight:900;letter-spacing:14px;color:#e9d5ff;text-shadow:0 0 18px rgba(124,58,237,.65),0 0 42px rgba(59,130,246,.4);margin-bottom:4px;position:relative;}
h1::after{content:'AYURIMA';position:absolute;left:0;top:0;color:#22d3ee;opacity:.32;transform:translate(3px,0);mix-blend-mode:screen;clip-path:inset(45% 0 35% 0);animation:glitch 4.5s infinite;}
@keyframes glitch{0%,92%,100%{transform:translate(3px,0);opacity:.3}93%{transform:translate(-4px,2px);opacity:.6}96%{transform:translate(5px,-2px);opacity:.5}}
.sub{font-family:'Share Tech Mono',monospace;color:#6b5fa0;font-size:12px;letter-spacing:7px;margin-bottom:34px;text-transform:uppercase;}
.sub .acc{color:#22d3ee;}
.race-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:30px;width:760px;}
.rcard{position:relative;background:linear-gradient(160deg,rgba(13,8,32,.72),rgba(6,3,18,.72));border:1px solid #241848;border-radius:4px;padding:0 0 14px;cursor:pointer;transition:.2s;text-align:left;overflow:hidden;backdrop-filter:blur(3px);}
.rcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--rc,#7c3aed),transparent);opacity:.7;}
.rcard:hover{border-color:var(--rc,#7c3aed);transform:translateY(-4px);box-shadow:0 12px 40px -12px var(--rc,#7c3aed);}
.rcard.sel{border-color:var(--rc,#a78bfa);box-shadow:0 0 0 1px var(--rc,#a78bfa),0 14px 50px -14px var(--rc,#a78bfa);}
.rcard .preview{width:100%;height:120px;display:block;background:radial-gradient(ellipse at 50% 70%,rgba(124,58,237,.10),transparent 70%);}
.rcard .rbody{padding:0 14px;}
.rcard .rtag{font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:2px;color:#4b3d78;margin-bottom:5px;}
.rcard h3{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.rcard p{font-size:12.5px;color:#8678ad;line-height:1.45;font-weight:500;}
.rcard .stats{display:flex;gap:12px;margin-top:9px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#4b3d78;}
.rcard .stats b{color:#7c6bb0;font-weight:400;}
.rcard.sel .selmark{opacity:1;}
.rcard .selmark{position:absolute;top:8px;right:9px;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--rc,#a78bfa);opacity:0;transition:.2s;}
.btn{font-family:'Orbitron',sans-serif;background:linear-gradient(135deg,rgba(79,29,150,.9),rgba(29,78,216,.9));border:1px solid rgba(167,139,250,.5);color:#e9d5ff;padding:14px 44px;border-radius:3px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:3px;transition:.18s;position:relative;overflow:hidden;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:translateX(-100%);transition:.5s;}

.btn:hover{filter:brightness(1.25);box-shadow:0 0 26px -6px rgba(124,58,237,.8);}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}
.btn:disabled::before{display:none;}
.pbtn{background:#0d0a1a;border:1px solid #1f1545;border-radius:8px;padding:6px 5px;cursor:pointer;text-align:left;transition:.12s;width:100%;margin-bottom:3px;display:block;}
.pbtn:hover:not(.dis):not(.lk){border-color:#7c3aed;background:#140e2a;}
.pbtn.dis{opacity:.4;cursor:not-allowed;}
.pbtn.lk{opacity:.3;cursor:not-allowed;border-style:dashed;}
.pbtn-name{font-size:11px;font-weight:700;color:#c4b5fd;}
.pbtn-sub{font-size:9px;color:#6b5fa0;}
.pbtn-cost{font-size:9px;color:#fde68a;}
.panel-sec{border-top:1px solid #1a1430;padding-top:5px;margin-top:5px;}
.sec-hd{font-size:9px;letter-spacing:.7px;color:#6b5fa0;margin-bottom:4px;text-transform:uppercase;}
.pbtn2{background:#0d1a30;border:1px solid #1c3058;border-radius:7px;padding:6px 5px;cursor:pointer;text-align:left;transition:.12s;width:100%;margin-bottom:3px;display:block;}
.pbtn2:hover:not(.dis):not(.lk){border-color:#2563eb;background:#0d1f3c;}
.pbtn2.dis{opacity:.4;cursor:not-allowed;}
.pbtn2.lk{opacity:.3;cursor:not-allowed;border-style:dashed;}
.bsel{background:#0a1520;border:1px solid #1a3555;border-radius:8px;padding:7px;margin-bottom:5px;}
.bsel-name{font-size:12px;font-weight:700;color:#38bdf8;margin-bottom:3px;}
.bhp-bg{height:5px;background:#1c1730;border-radius:2px;overflow:hidden;margin-bottom:5px;}
.bhp-f{height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);transition:width .3s;}
.qrow{display:flex;gap:3px;margin-bottom:4px;}
.qslot{flex:1;background:#111827;border:1px solid #1f2937;border-radius:5px;padding:3px;min-height:28px;position:relative;overflow:hidden;cursor:pointer;}
.qslot.active{border-color:#fde047;}
.qsn{font-size:7px;color:#9ca3af;line-height:1.2;}
.qsp{position:absolute;bottom:0;left:0;height:3px;background:#fde047;}
.qsc{position:absolute;top:1px;right:2px;font-size:7px;color:#6b7280;cursor:pointer;}
.qsc:hover{color:#f87171;}
.rally-btn{font-size:9px;background:#1e3a5c;border:1px solid #2563eb;color:#60a5fa;padding:3px 8px;border-radius:4px;cursor:pointer;margin-top:3px;width:100%;display:block;}
.rally-btn:hover{background:#1d4ed8;}
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px;}
.tbtn{background:#0a0818;border:1px solid #1a0f3a;border-radius:6px;padding:5px 4px;cursor:pointer;font-size:9px;text-align:center;transition:.12s;color:#9ca3af;}

.tbtn.done{border-color:#4ade80;color:#4ade80;cursor:default;}
.tbtn.dis{opacity:.35;cursor:not-allowed;}
.sbar{height:4px;background:#1a0f3a;border-radius:2px;overflow:hidden;margin-top:2px;}
.sbar-f{height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4);}
#over{display:none;}
.over-title{font-size:36px;font-weight:900;margin-bottom:12px;}
.win{color:#4ade80;}.lose{color:#f87171;}

.mission-card-brief:hover{border-color:#7c3aed;background:#120c2a;}
.btn-outline{background:transparent;border:1px solid #2d1f5e;color:#6b5fa0;padding:8px 24px;border-radius:6px;cursor:pointer;font-size:12px;transition:.15s;}

</head>

}

window.addEventListener('keyup',e=>{keys[e.code]=false;});

  renderer.setSize(innerWidth,innerHeight);

});

function updateCam(dt){
  const spd=24*dt,rs=1.2*dt;
  if(keys['KeyW']||keys['ArrowUp'])cam.z-=spd;
  if(keys['KeyS']||keys['ArrowDown'])cam.z+=spd;
  if(keys['KeyA']||keys['ArrowLeft'])cam.x-=spd;
  if(keys['KeyD']||keys['ArrowRight'])cam.x+=spd;
  if(keys['KeyQ'])cam.rot-=rs;if(keys['KeyE'])cam.rot+=rs;
  cam.x=clamp(cam.x,-MAP/2,MAP/2);
  cam.z=clamp(cam.z,-MAP/2,MAP/2);
  const a=cam.rot;const h=cam.zoom;const back=cam.zoom*0.8;
  camera.position.set(cam.x+Math.sin(a)*back,h,cam.z+Math.cos(a)*back);
  camera.lookAt(cam.x,0,cam.z);
}

// ── SOUNDS ────────────────────────────────────────────────────────────────
const actx=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,vol=0.12,type='sine',decay=0.8){
  if(actx.state==='suspended')actx.resume();
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur*decay);
  o.start();o.stop(actx.currentTime+dur);
}
const SND={
  sel:()=>beep(660,0.08,0.06,'sine'),
  move:()=>beep(440,0.06,0.05,'triangle'),
  atk:()=>beep(220,0.05,0.07,'sawtooth'),
  build:()=>beep(880,0.12,0.09,'sine'),
  wave:()=>{beep(220,0.3,0.15,'sawtooth');setTimeout(()=>beep(180,0.4,0.12,'sawtooth'),200);},
  win:()=>{for(let i=0;i<5;i++)setTimeout(()=>beep(440+i*110,0.2,0.1,'sine'),i*120);},
  lose:()=>{for(let i=0;i<3;i++)setTimeout(()=>beep(200-i*40,0.3,0.1,'sawtooth'),i*200);}
};

const ray=new THREE.Raycaster();
const gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function getWorldPos(ex,ey){
  const nd=new THREE.Vector2((ex/innerWidth)*2-1,-(ey/innerHeight)*2+1);

  const t=new THREE.Vector3();
  ray.ray.intersectPlane(gPlane,t);

}

    const top=mesh(new THREE.BoxGeometry(sz*1.38,sz*0.95,sz*1.38),mat());top.position.y=sz*0.77;g.add(top);

// ── BASE MESH FACTORY ─────────────────────────────────────────────────────
function mkBaseMesh(raceId, team){
  const g=new THREE.Group();
  const rd=RACES[raceId];
  const col=new THREE.Color(team===1?rd.color:'#ef4444');
  const eCol=col.clone().multiplyScalar(0.22);
  const mat=(c,e)=>new THREE.MeshPhongMaterial({color:c||col,emissive:e||eCol,shininess:55});

  const platform=mesh(new THREE.CylinderGeometry(3.4,3.9,0.48,8),mat());g.add(platform);

  if(raceId==='nexus'||team===2){
    const body=mesh(new THREE.BoxGeometry(3.8,2.8,3.8),mat());body.position.y=1.68;g.add(body);
    for(const cx of[-1,1])for(const cz of[-1,1]){
      const t=mesh(new THREE.CylinderGeometry(0.48,0.58,3.8,6),mat());
      t.position.set(cx*1.95,2,cz*1.95);g.add(t);
      const cap=mesh(new THREE.CylinderGeometry(0.58,0.58,0.38,6),mat());
      cap.position.set(cx*1.95,3.9,cz*1.95);g.add(cap);
    }
    const spire=mesh(new THREE.ConeGeometry(0.55,3.8,6),mat());spire.position.y=5.2;g.add(spire);
    const gem=mesh(new THREE.OctahedronGeometry(0.4),mat(0xc4b5fd,0x7c3aed));gem.position.y=7.2;g.add(gem);

  } else if(raceId==='vide'){
    const hive=mesh(new THREE.SphereGeometry(2.1,12,10),mat());hive.position.y=2.4;g.add(hive);
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      const t=mesh(new THREE.CylinderGeometry(0.14,0.28,2.8,5),mat());
      t.position.set(Math.cos(a)*1.7,1.0,Math.sin(a)*1.7);
      t.rotation.z=Math.sin(a)*0.38;t.rotation.x=Math.cos(a)*0.38;g.add(t);
    }

  } else if(raceId==='cristal'){
    const ring2=mesh(new THREE.CylinderGeometry(2.4,2.9,0.95,6),mat());ring2.position.y=0.48;g.add(ring2);
    for(let i=0;i<6;i++){
      const a=i/6*Math.PI*2;
      const h=i%2===0?5.5:3.8;
      const r=i%2===0?1.9:0.6;
      const sp=mesh(new THREE.ConeGeometry(i%2===0?0.38:0.24,h,6),
        new THREE.MeshPhongMaterial({color:col,emissive:0x0891b2,shininess:110,transparent:true,opacity:0.87}));
      sp.position.set(Math.cos(a)*r,h/2+0.95,Math.sin(a)*r);g.add(sp);
    }

  } else {
    // synth
    const slab=mesh(new THREE.BoxGeometry(4.8,0.75,4.8),mat());slab.position.y=0.38;g.add(slab);
    const pillar=mesh(new THREE.CylinderGeometry(1.15,1.52,4.8,8),mat());pillar.position.y=3.2;g.add(pillar);
    const torus=mesh(new THREE.TorusGeometry(1.9,0.14,6,16),mat(0xfbbf24,0xd97706));
    torus.position.y=5.5;torus.rotation.x=Math.PI/2;g.add(torus);
    const antenna=mesh(new THREE.CylinderGeometry(0.08,0.08,2,4),mat(0xfbbf24,0xd97706));
    antenna.position.y=6.9;g.add(antenna);
  }
  return g;
}

// ── BASES ─────────────────────────────────────────────────────────────────
function getPBase(){return G.blds.find(b=>b.team===1&&b.alive&&b.isBase);}
function getEBase(){return G.blds.find(b=>b.team===2&&b.alive&&b.isBase);}

function hasBld(typeId){
  return G.pblds.some(b=>b.alive&&b.team===1&&b.typeId===typeId);
}

function spawnBase(race,x,z,team){
  const g=mkBaseMesh(race,team);
  g.position.set(x,0,z);
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
  scene.add(g);
  const hp=team===1?700:550;
  const b={id:G.nid++,typeId:'base',name:team===1?'QG Allié':'QG Ennemi',team,x,z,hp,maxHp:hp,mesh:g,alive:true,isBase:true,vr:14};
  G.blds.push(b);return b;
}

// ── PRODUCTION BUILDINGS ───────────────────────────────────────────────────
function buildPBld(typeId){
  const race=RACES[G.race];
  const def=race.bldgs.find(b=>b.id===typeId);
  if(!def){toast('Bâtiment inconnu');return;}
  if(G.ess<def.cost){toast('Essence insuffisante!');return;}
  if(def.bldReq&&!hasBld(def.bldReq)){
    const req=race.bldgs.find(b=>b.id===def.bldReq);
    toast('Requis: '+( req?req.name:def.bldReq));return;
  }
  const existing=G.pblds.filter(b=>b.alive&&b.team===1&&b.typeId===typeId).length;
  if(existing>=2){toast('Maximum 2 de ce type!');return;}
  G.ess-=def.cost;
  const pb=getPBase();
  const slot=G.pblds.filter(b=>b.team===1&&b.alive).length;
  const angle=(slot*50+110)*PI/180;
  const r=9+Math.floor(slot/5)*3;
  const x=clamp(pb.x+Math.cos(angle)*r,-MAP/2+5,MAP/2-5);
  const z=clamp(pb.z+Math.sin(angle)*r,-MAP/2+5,MAP/2-5);
  spawnPBld(typeId,x,z,1);
  SND.build();toast(def.name+' construit!');
  updateBuildUI();
}

function spawnPBld(typeId,wx,wz,team){
  const race=RACES[team===1?G.race:G.er];
  const def=race.bldgs.find(b=>b.id===typeId);
  if(!def)return null;
  const hp=Math.floor(def.hp*(team===1?G.tb.bhm:1));
  const g=mkBldMesh(def,team===1?G.race:G.er);
  g.position.set(wx,0,wz);
  g.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;}});
  scene.add(g);
  const b={id:G.nid++,typeId,name:def.name,def,team,x:wx,z:wz,hp,maxHp:hp,mesh:g,alive:true,isPBld:true,queue:[],rally:null,vr:10};
  G.pblds.push(b);
  return b;
}

// ── UNIT PRODUCTION QUEUE ──────────────────────────────────────────────────
function queueUnit(bldId,unitId){
  const b=G.pblds.find(pb=>pb.id===bldId&&pb.alive&&pb.team===1);
  if(!b){toast('Bâtiment introuvable');return;}
  if(b.queue.length>=3){toast('File pleine! (max 3)');return;}
  const race=RACES[G.race];
  const ud=race.units.find(u=>u.id===unitId);
  if(!ud){toast('Unité inconnue');return;}
  if(ud.req&&!hasBld(ud.req)){toast('Bâtiment requis manquant');return;}
  if(G.ess<ud.cost){toast('Essence insuffisante!');return;}
  const pendingPop=G.pblds.reduce((s,pb)=>s+pb.queue.reduce((qs,qi)=>{const u2=race.units.find(u=>u.id===qi.unitId);return qs+(u2?u2.pop:0);},0),0);
  if(G.pop+pendingPop>=G.maxPop){toast('Population max!');return;}
  G.ess-=ud.cost;
  const prod=8+(ud.cost/20);
  b.queue.push({unitId,name:ud.name,total:prod,prog:0,cost:ud.cost});
  updateBuildUI();
}

function cancelQueue(bldId,qi){
  const b=G.pblds.find(pb=>pb.id===bldId&&pb.alive&&pb.team===1);
  if(!b||!b.queue[qi])return;
  const q=b.queue[qi];
  G.ess+=Math.floor(q.cost*0.8);
  b.queue.splice(qi,1);
  toast('Production annulée, 80% remboursé');
  updateBuildUI();
}

function updateQueues(dt){
  const race=RACES[G.race];
  for(const b of G.pblds){
    if(!b.alive||!b.queue.length)continue;
    const q=b.queue[0];q.prog+=dt;
    if(q.prog>=q.total){
      b.queue.shift();
      const rx=b.rally?b.rally.x:b.x+rr(-3,3);
      const rz=b.rally?b.rally.z:b.z+rr(-3,3);
      if(b.team===1){
        const u=spawnUnit(q.unitId,G.race,b.x,b.z,1);
        if(u){u.dest={x:rx,z:rz};}
        SND.build();
        toast(q.name+' prêt!',1500);
      }
    }
  }
}

// ── UNITS ─────────────────────────────────────────────────────────────────
function spawnUnit(uid,race,wx,wz,team){
  const rd=RACES[race];
  const ud=rd.units.find(u=>u.id===uid);
  if(!ud)return null;
  const eff=team===1?G.tb:G.eb;
  const hp=Math.floor(ud.hp*eff.bhm);

  const g=mkUnitMesh(ud,race);
  const spawnX=wx+rr(-1,1);
  const spawnZ=wz+rr(-1,1);
  g.position.set(spawnX,0,spawnZ);
  g.scale.setScalar(0.9+ud.pop*0.18);
  g.traverse(c=>{if(c.isMesh)c.castShadow=true;});
  scene.add(g);

  // Team color ring
  const teamRing=new THREE.Mesh(
    new THREE.TorusGeometry(0.3,0.06,5,10),
    new THREE.MeshBasicMaterial({color:team===1?0x4ade80:0xf87171})
  );
  teamRing.rotation.x=Math.PI/2;teamRing.position.y=-0.15;g.add(teamRing);

  const sz=0.4+ud.pop*0.1;
  const u={
    id:G.nid++,uid,name:ud.name,race,team,
    x:g.position.x,z:g.position.z,
    hp,maxHp:hp,
    atk:Math.floor(ud.atk*(eff.em||1)),
    rng:ud.rng,
    spd:ud.spd*(eff.asm||1),
    rep:ud.rep,
    repT:0,
    mesh:g,sz,
    alive:true,
    harvester:!!ud.harvester,
    stationary:!!ud.stationary,
    dest:null,
    target:null,
    harvT:0,
    harv:null,
    poisonT:0,
    sdb:eff.sdb||0,
    pop:ud.pop
  };
  G.units.push(u);
  G.pop+=ud.pop;
  return u;
}

function removeUnit(u){
  if(!u.alive)return;
  u.alive=false;
  scene.remove(u.mesh);
  G.pop-=u.pop;
  if(G.pop<0)G.pop=0;
}

// ── AI SPAWN ───────────────────────────────────────────────────────────────
function getAIUnits(){
  const rd=RACES[G.er];
  const hasBldE=(typeId)=>G.pblds.some(b=>b.alive&&b.team===2&&b.typeId===typeId);
  const avail=rd.units.filter(u=>{
    if(!u.req)return true;
    return hasBldE(u.req);
  });
  if(!avail.length)return [rd.units[0]];
  return avail;
}

function spawnWave(){
  G.wave++;
  const eb=getEBase();if(!eb)return;
  const rd=RACES[G.er];
  const avail=getAIUnits();
  const count=3+G.wave*2;
  SND.wave();toast('⚔ Vague '+G.wave+' ennemie!',3000);
  for(let i=0;i<count;i++){
    const ud=avail[Math.floor(Math.random()*avail.length)];
    const ex=eb.x+rr(-5,5),ez=eb.z+rr(-5,5);
    setTimeout(()=>{if(!G.over)spawnUnit(ud.id,G.er,ex,ez,2);},i*300);
  }
  if(G.wave%2===0){
    const bldgs=rd.bldgs;
    const toBuild=bldgs.filter(b=>{
      if(b.bldReq&&!G.pblds.some(pb=>pb.alive&&pb.team===2&&pb.typeId===b.bldReq))return false;
      const existing=G.pblds.filter(pb=>pb.alive&&pb.team===2&&pb.typeId===b.id).length;
      return existing<1;
    });
    if(toBuild.length){
      const bd=toBuild[0];
      const slot=G.pblds.filter(b=>b.team===2&&b.alive).length;
      const angle=(slot*55+250)*PI/180;
      const r=8+Math.floor(slot/4)*3;
      const x=clamp(eb.x+Math.cos(angle)*r,-MAP/2+5,MAP/2-5);
      const z=clamp(eb.z+Math.sin(angle)*r,-MAP/2+5,MAP/2-5);
      spawnPBld(bd.id,x,z,2);
    }
  }
  // Wave completion toast
  toast('Vague '+G.wave+' complétée!',2000);
  G.waveT=0;G.waveInt=Math.max(22,G.waveInt-1.5);
}

// ── DAMAGE & PROJECTILES ──────────────────────────────────────────────────
function addFloat(x,z,val,col){
  G.floats.push({x,z,val,life:1.2,col,vy:0});
}

function dealDmg(attacker,target,amount){
  if(!target||!target.alive)return;
  const att=attacker?attacker.team===1?G.tb:G.eb:G.tb;
  const def=target.team===1?G.tb:G.eb;
  if(def.ref>0&&Math.random()<def.ref){
    if(attacker&&attacker.alive)dealDmg(null,attacker,Math.floor(amount*0.4));
    addFloat(target.x||0,target.z||0,'↩',attacker&&attacker.team===1?'#4ade80':'#f87171');
    return;
  }
  if(att.poison&&target.hp!==undefined){
    target.poisonT=(target.poisonT||0)+4;
  }
  if(att.sdb>0)amount+=rr(0,att.sdb)|0;
  target.hp-=amount;
  if(amount>0&&(target.x!==undefined||target.mesh)){
    const tx=target.x!==undefined?target.x:(target.mesh?target.mesh.position.x:0);
    const tz=target.z!==undefined?target.z:(target.mesh?target.mesh.position.z:0);
    addFloat(tx,tz,Math.floor(amount),target.team===1?'#f87171':'#fde047');
  }
  if(target.hp<=0){
    target.hp=0;
    if(target.isPBld){
      target.alive=false;
      scene.remove(target.mesh);
      const race=RACES[target.team===1?G.race:G.er];
      let refund=0;
      for(const q of target.queue){refund+=Math.floor(q.cost*0.5);}
      if(target.team===1){
        G.ess+=refund;
        if(refund>0)toast('Bâtiment détruit! +'+refund+' essence récupérée');
        else toast(target.name+' détruit!');
        if(G.selBld===target.id){G.selBld=null;updateBuildUI();}
      }
    } else if(target.alive!==undefined&&!target.isPBld&&!target.isBase){
      if(target.alive){
        if(attacker&&att.de>0&&attacker.team!==target.team){
          G.ess=Math.min(9999,G.ess+(att.de));
        }
        removeUnit(target);
      }
    } else if(target.isBase){
      target.alive=false;
      target.hp=0;
      scene.remove(target.mesh);
      if(target.team===1){endGame(false);}
      else{endGame(true);}
    }
  }
}

function spawnProj(from,to,col,dmg){
  const geo=new THREE.SphereGeometry(0.12,4,4);
  const mat=new THREE.MeshBasicMaterial({color:col});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(from.x||from.mesh.position.x,0.8,from.z||from.mesh.position.z);
  scene.add(m);
  const tx=to.x!==undefined?to.x:to.mesh.position.x;
  const tz=to.z!==undefined?to.z:to.mesh.position.z;
  G.projs.push({mesh:m,tx,tz,dmg,target:to,spd:16,done:false});
}

function updateProjs(dt){
  for(const p of G.projs){
    if(p.done)continue;
    const dx=p.tx-p.mesh.position.x,dz=p.tz-p.mesh.position.z;
    const d=Math.hypot(dx,dz);
    if(d<0.3){
      dealDmg(null,p.target,p.dmg);
      scene.remove(p.mesh);p.done=true;
    } else {
      const s=Math.min(p.spd*dt,d);
      p.mesh.position.x+=dx/d*s;p.mesh.position.z+=dz/d*s;
    }
  }
  G.projs=G.projs.filter(p=>!p.done);
}

// ── FIND ENEMY ────────────────────────────────────────────────────────────
function findEnemy(u){
  const et=u.team===1?2:1;
  let best=null,bd=u.rng*1.8;
  for(const t of G.units){
    if(!t.alive||t.team!==et)continue;
    const d=dst(u,t);
    if(d<bd){bd=d;best=t;}
  }
  if(!best){
    for(const b of G.blds){
      if(!b.alive||b.team!==et)continue;
      const d=dst2(u.x,u.z,b.x,b.z);
      if(d<u.rng*1.8&&d<bd){bd=d;best=b;}
    }
  }
  if(!best){
    for(const pb of G.pblds){
      if(!pb.alive||pb.team!==et)continue;
      const d=dst2(u.x,u.z,pb.x,pb.z);
      if(d<u.rng*1.8&&d<bd){bd=d;best=pb;}
    }
  }
  return best;
}

function findMine(u){
  let best=null,bd=MINE_RANGE+u.rng;
  for(const m of G.mines){
    if(m.ess<=0)continue;
    const d=dst2(u.x,u.z,m.x,m.z);
    if(d<bd){bd=d;best=m;}
  }
  return best;
}

// ── UNIT AI ───────────────────────────────────────────────────────────────
function updateUnits(dt){
  for(const u of G.units){
    if(!u.alive)continue;
    if(u.poisonT>0){
      u.poisonT-=dt;
      u.hp-=2*dt;
      if(u.hp<=0){removeUnit(u);continue;}
    }
    const eff=u.team===1?G.tb:G.eb;
    if(eff.regen>0&&u.hp<u.maxHp){u.hp=Math.min(u.maxHp,u.hp+eff.regen*dt);}
    u.repT=Math.max(0,u.repT-dt);
    if(u.harvester&&u.team===1){
      if(!u.harv){u.harv=findMine(u);}
      if(u.harv&&u.harv.ess<=0)u.harv=null;
      if(u.harv){
        const d=dst2(u.x,u.z,u.harv.x,u.harv.z);
        if(d>MINE_RANGE){moveToward(u,u.harv.x,u.harv.z,dt);}
        else{
          u.harvT+=dt;
          if(u.harvT>=HARV_INT){
            u.harvT=0;
            const gain=Math.min(u.harv.ess,rr(6,14)|0);
            u.harv.ess-=gain;
            G.ess+=gain;
            if(G.tb.de>0)G.ess+=G.tb.de*0.1|0;
          }
        }
        continue;
      }
    }
    if(!u.stationary){
      if(u.target&&(!u.target.alive||u.target.hp<=0)){u.target=null;}
      if(!u.target)u.target=findEnemy(u);
      if(u.target){
        const td=dst2(u.x,u.z,u.target.x||0,u.target.z||0);
        if(td>u.rng){moveToward(u,u.target.x||0,u.target.z||0,dt);}
        else if(u.repT<=0){
          u.repT=u.rep;SND.atk();
          spawnProj(u,u.target,u.team===1?0x60a5fa:0xf87171,u.atk);
        }
      } else if(u.dest){
        const d=dst2(u.x,u.z,u.dest.x,u.dest.z);
        if(d>0.5)moveToward(u,u.dest.x,u.dest.z,dt);
        else u.dest=null;
      } else if(u.team===2){
        const pb=getPBase();
        if(pb)moveToward(u,pb.x+rr(-3,3),pb.z+rr(-3,3),dt);
      }
    } else {
      if(u.target&&!u.target.alive)u.target=null;
      if(!u.target)u.target=findEnemy(u);
      if(u.target&&u.repT<=0){
        u.repT=u.rep;SND.atk();
        spawnProj(u,u.target,u.team===1?0x60a5fa:0xf87171,u.atk);
      }
    }
    if(!u.stationary){u.mesh.position.set(u.x,0,u.z);}
  }
  for(const u of G.units){if(!u.alive)continue;if(u.hp<=0)removeUnit(u);}
}

function moveToward(u,tx,tz,dt){
  const dx=tx-u.x,dz=tz-u.z;
  const d=Math.hypot(dx,dz);
  if(d<0.1)return;
  const s=Math.min(u.spd*dt,d);
  u.x+=dx/d*s;u.z+=dz/d*s;
}

// ── MINES UPDATE ──────────────────────────────────────────────────────────
function updateMines(dt){
  for(const m of G.mines){
    m.mesh.rotation.y+=dt*0.6;
    if(m.ess<m.maxEss){m.ess=Math.min(m.maxEss,m.ess+m.regen*dt);}
    const t=m.ess/m.maxEss;
    m.mesh.material.opacity=0.3+0.7*t;
    m.mesh.material.emissiveIntensity=t;
  }
}

// ── MINIMAP ───────────────────────────────────────────────────────────────
let mmCtx=null;
function initMinimap(){
  const cv=document.getElementById('mmcv');
  mmCtx=cv.getContext('2d');
  cv.addEventListener('click',e=>{
    const r=cv.getBoundingClientRect();
    const px=(e.clientX-r.left)/130*MAP-MAP/2;
    const pz=(e.clientY-r.top)/130*MAP-MAP/2;
    cam.x=px;cam.z=pz;
  });
}

function drawMinimap(){
  if(!mmCtx)return;
  const W=130,H=130;
  mmCtx.fillStyle='#040210';mmCtx.fillRect(0,0,W,H);
  const toMM=(x,z)=>({mx:(x+MAP/2)/MAP*W,mz:(z+MAP/2)/MAP*H});
  for(const m of G.mines){
    if(m.ess<1)continue;
    const p=toMM(m.x,m.z);
    mmCtx.fillStyle='#a78bfa';mmCtx.fillRect(p.mx-2,p.mz-2,4,4);
  }
  for(const b of G.blds){
    if(!b.alive)continue;
    const p=toMM(b.x,b.z);
    mmCtx.fillStyle=b.team===1?'#3b82f6':'#ef4444';
    mmCtx.fillRect(p.mx-5,p.mz-5,10,10);
  }
  for(const b of G.pblds){
    if(!b.alive)continue;
    const p=toMM(b.x,b.z);
    mmCtx.fillStyle=b.team===1?'#60a5fa':'#f87171';
    mmCtx.fillRect(p.mx-3,p.mz-3,6,6);
  }
  for(const u of G.units){
    if(!u.alive)continue;
    const p=toMM(u.x,u.z);
    mmCtx.fillStyle=u.team===1?'#4ade80':'#f87171';
    mmCtx.fillRect(p.mx-1,p.mz-1,2,2);
  }
  const vc=toMM(cam.x,cam.z);
  mmCtx.strokeStyle='rgba(255,255,255,0.3)';mmCtx.lineWidth=1;
  mmCtx.strokeRect(vc.mx-12,vc.mz-10,24,20);
}

// ── START GAME ────────────────────────────────────────────────────────────

// ── TECH ──────────────────────────────────────────────────────────────────
function buyTech(tid){
  const td=RACES[G.race].tech.find(t=>t.id===tid);
  if(!td||G.tech[tid])return;
  if(G.ess<td.cost){toast('Essence insuffisante!');return;}
  G.ess-=td.cost;G.tech[tid]=true;
  const ef=td.ef;
  if(ef.atk){for(const u of G.units)if(u.team===1)u.atk=Math.floor(u.atk*ef.atk);}
  if(ef.bhm)G.tb.bhm*=ef.bhm;
  if(ef.ref)G.tb.ref=Math.min(0.5,G.tb.ref+(ef.ref||0));
  if(ef.regen)G.tb.regen+=(ef.regen||0);
  if(ef.pop){G.tb.pop=(G.tb.pop||0)+(ef.pop||0);G.maxPop+=ef.pop;}
  if(ef.poison)G.tb.poison=true;
  if(ef.de)G.tb.de+=(ef.de||0);
  if(ef.em)G.tb.em*=ef.em;
  if(ef.asm)G.tb.asm*=ef.asm;
  if(ef.sdb)G.tb.sdb+=(ef.sdb||0);
  if(ef.novaUp)G.tb.novaUp=true;
  toast('Tech: '+td.name+' activée!');
  updateBuildUI();
}

// Direct spawn
function spawnDirect(uid){
  const rd=RACES[G.race];
  const ud=rd.units.find(u=>u.id===uid);
  if(!ud)return;
  if(G.ess<ud.cost){toast('Essence insuffisante!');return;}
  if(G.pop>=G.maxPop){toast('Population maximale!');return;}
  if(ud.req&&!hasBld(ud.req)){
    const req=rd.bldgs.find(b=>b.id===ud.req);
    toast('Requis: '+(req?req.name:ud.req));return;
  }
  G.ess-=ud.cost;
  const pb=getPBase();
  spawnUnit(uid,G.race,pb?pb.x+rr(-3,3):rr(-5,5),pb?pb.z+rr(-2,2):rr(-5,5),1);
  SND.build();toast(ud.name+' déployé!',1200);
  updateBuildUI();
}

// ── SELECTION & INPUT ─────────────────────────────────────────────────────
let dragStart=null,dragging=false;
const selBox={el:null};

function onMouseDown(e){
  if(e.target.closest('#panel,#minimap'))return;
  if(e.button===2){
    e.preventDefault();
    const wp=getWorldPos(e.clientX,e.clientY);
    if(!wp)return;
    if(G.rallyMode&&G.selBld!==null){
      const b=G.pblds.find(pb=>pb.id===G.selBld&&pb.alive);
      if(b){
        b.rally={x:wp.x,z:wp.z};
        if(b.rallyMesh)scene.remove(b.rallyMesh);
        const rm=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),new THREE.MeshBasicMaterial({color:0x4ade80}));
        rm.position.set(wp.x,0.3,wp.z);scene.add(rm);b.rallyMesh=rm;
        toast('Point de ralliement placé!',1200);
      }
      G.rallyMode=false;
      return;
    }
    if(G.sel.length>0){
      SND.move();
      const cx=wp.x,cz=wp.z;
      const n=G.sel.length;
      G.sel.forEach((id,i)=>{
        const u=G.units.find(u=>u.id===id);
        if(u&&!u.stationary){
          const angle=(i/n)*2*PI;
          const r=i===0?0:1.5;
          u.dest={x:cx+Math.cos(angle)*r,z:cz+Math.sin(angle)*r};
          u.target=null;
        }
      });
    }
    return;
  }
  if(e.button===0){
    dragStart={x:e.clientX,y:e.clientY};
    dragging=false;
  }
}

function onMouseMove(e){
  if(dragStart&&(e.buttons&1)){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)>5){
      dragging=true;
      if(!selBox.el){
        const d=document.createElement('div');
        d.style.cssText='position:fixed;border:1px solid #7c3aed;background:rgba(124,58,237,.08);pointer-events:none;z-index:10';
        document.body.appendChild(d);selBox.el=d;
      }
      const l=Math.min(dragStart.x,e.clientX);
      const t=Math.min(dragStart.y,e.clientY);
      const w=Math.abs(dx),h=Math.abs(dy);
      selBox.el.style.left=l+'px';selBox.el.style.top=t+'px';
      selBox.el.style.width=w+'px';selBox.el.style.height=h+'px';
    }
  }
}

function onMouseUp(e){
  if(e.target.closest('#panel,#minimap'))return;
  if(e.button===0){
    if(selBox.el){document.body.removeChild(selBox.el);selBox.el=null;}
    if(dragging&&dragStart){
      const x1=Math.min(dragStart.x,e.clientX),x2=Math.max(dragStart.x,e.clientX);
      const y1=Math.min(dragStart.y,e.clientY),y2=Math.max(dragStart.y,e.clientY);
      G.sel=[];G.selBld=null;
      for(const u of G.units){
        if(!u.alive||u.team!==1)continue;
        const sp=worldToScreen(u.x,u.z);
        if(sp&&sp.x>=x1&&sp.x<=x2&&sp.y>=y1&&sp.y<=y2)G.sel.push(u.id);
      }
      if(G.sel.length)SND.sel();
      dragging=false;dragStart=null;
      updateSelUI();updateBuildUI();
      return;
    }
    dragStart=null;dragging=false;
    const wp=getWorldPos(e.clientX,e.clientY);
    if(!wp)return;
    for(const pb of G.pblds){
      if(pb.alive&&pb.team===1&&dst2(pb.x,pb.z,wp.x,wp.z)<pb.def.sz+1){
        G.selBld=pb.id;G.sel=[];SND.sel();
        updateBuildUI();updateSelUI();return;
      }
    }
    let closest=null,cbest=2.5;
    for(const u of G.units){
      if(!u.alive||u.team!==1)continue;
      const d=dst2(u.x,u.z,wp.x,wp.z);
      if(d<cbest){cbest=d;closest=u;}
    }
    if(closest){
      if(!e.shiftKey)G.sel=[closest.id];
      else if(!G.sel.includes(closest.id))G.sel.push(closest.id);
      SND.sel();G.selBld=null;
    } else {
      G.sel=[];G.selBld=null;
    }
    updateSelUI();updateBuildUI();
  }
}

function worldToScreen(wx,wz){
  const v=new THREE.Vector3(wx,0.8,wz);
  v.project(camera);
  if(v.z>1)return null;
  return{x:(v.x+1)/2*innerWidth,y:(-v.y+1)/2*innerHeight,z:v.z};
}

window.addEventListener('mousemove',onMouseMove);
window.addEventListener('mouseup',onMouseUp);

function drawHUD(dt){
  hctx.clearRect(0,0,hcv.width,hcv.height);
  for(const u of G.units){
    if(!u.alive)continue;
    const sp=worldToScreen(u.x,u.z);if(!sp)continue;
    const w=28,h=3;
    const pct=u.hp/u.maxHp;
    hctx.fillStyle='rgba(0,0,0,0.5)';
    hctx.fillRect(sp.x-w/2,sp.y-14,w,h);
    hctx.fillStyle=u.team===1?`hsl(${120*pct},80%,45%)`:'#ef4444';
    hctx.fillRect(sp.x-w/2,sp.y-14,w*pct,h);
    if(G.sel.includes(u.id)){
      hctx.strokeStyle='#4ade80';hctx.lineWidth=1.5;
      hctx.strokeRect(sp.x-14,sp.y-12,28,24);
    }
  }
  for(const b of [...G.blds,...G.pblds]){
    if(!b.alive)continue;
    const sp=worldToScreen(b.x,b.z);if(!sp)continue;
    const w=36,h=4;
    const pct=b.hp/b.maxHp;
    hctx.fillStyle='rgba(0,0,0,0.6)';
    hctx.fillRect(sp.x-w/2,sp.y-20,w,h);
    hctx.fillStyle=b.team===1?`hsl(${120*pct},70%,45%)`:'#dc2626';
    hctx.fillRect(sp.x-w/2,sp.y-20,w*pct,h);
    if(G.selBld===b.id){
      hctx.strokeStyle='#38bdf8';hctx.lineWidth=2;
      hctx.strokeRect(sp.x-18,sp.y-22,36,28);
    }
    if(b.isPBld&&b.queue.length>0){
      const q=b.queue[0];
      const qpct=q.prog/q.total;
      hctx.fillStyle='rgba(0,0,0,0.5)';
      hctx.fillRect(sp.x-w/2,sp.y-14,w,3);
      hctx.fillStyle='#fde047';
      hctx.fillRect(sp.x-w/2,sp.y-14,w*qpct,3);
    }
  }
  // Floating damage numbers — fixed screen-space movement
  for(const f of G.floats){
    f.life-=dt;
    f.vy+=dt*28;
    const sp=worldToScreen(f.x,f.z);
    if(!sp||sp.z>1)continue;
    const alpha=Math.max(0,f.life/1.2);
    hctx.save();
    hctx.globalAlpha=alpha;
    hctx.font=`bold ${11+Math.min(4,Math.floor((1-f.life/1.2)*6))}px Segoe UI`;
    hctx.fillStyle=f.col;
    hctx.textAlign='center';
    hctx.shadowColor=f.col;hctx.shadowBlur=5;
    hctx.fillText(f.val,sp.x,sp.y-f.vy);
    hctx.restore();
  }
  G.floats=G.floats.filter(f=>f.life>0);
  // Rally point indicators
  if(G.selBld!==null){
    const b=G.pblds.find(pb=>pb.id===G.selBld&&pb.alive);
    if(b&&b.rally){
      const sp=worldToScreen(b.rally.x,b.rally.z);
      if(sp){
        hctx.fillStyle='#4ade80';hctx.font='14px Segoe UI';
        hctx.textAlign='center';hctx.fillText('📍',sp.x,sp.y);
      }
    }
  }
  if(G.rallyMode){
    hctx.fillStyle='rgba(74,222,128,0.8)';
    hctx.font='bold 13px Segoe UI';
    hctx.textAlign='center';
    hctx.fillText('Clic droit pour placer le point de ralliement',innerWidth/2,40);
  }
  for(const m of G.mines){
    if(m.ess<1)continue;
    const sp=worldToScreen(m.x,m.z);if(!sp)continue;
    hctx.fillStyle='rgba(167,139,250,0.85)';
    hctx.font='9px Segoe UI';hctx.textAlign='center';
    hctx.fillText('✦'+Math.floor(m.ess),sp.x,sp.y+20);
  }
}

// ── GAME OVER ─────────────────────────────────────────────────────────────
function endGame(won){
  if(G.over)return;
  G.over=true;G.running=false;
  // Campaign unlock
  if(won&&G.activeMission){
    const missions=MISSIONS;
    const idx=missions.findIndex(m=>m.id===G.activeMission.id);
    if(idx>=0&&idx<missions.length-1){
      unlockMission(missions[idx+1].id);
    }
  }
  const over=document.getElementById('over');
  over.style.display='flex';
  document.getElementById('overT').textContent=won?'VICTOIRE!':'DÉFAITE';
  document.getElementById('overT').className='over-title '+(won?'win':'lose');
  let subMsg='';
  if(won){
    subMsg='Vague '+G.wave+' | Temps: '+Math.floor(G.gameT/60)+'m'+Math.floor(G.gameT%60)+'s';
    if(G.activeMission){
      const idx=MISSIONS.findIndex(m=>m.id===G.activeMission.id);
      if(idx>=0&&idx<MISSIONS.length-1)subMsg+=' | Mission suivante déverrouillée!';
    }
  } else {
    subMsg='Votre base a été détruite...';
  }
  document.getElementById('overS').textContent=subMsg;
  if(won)SND.win();else SND.lose();
}

// ── MENU SHOWCASE SCENE (3D background) ─────────────────────────────────────
const showScene=new THREE.Scene();
showScene.background=new THREE.Color(0x05030f);
showScene.fog=new THREE.Fog(0x05030f,14,42);
const showCam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
showCam.position.set(0,2.4,9);showCam.lookAt(0,1.6,0);
showScene.add(new THREE.AmbientLight(0x241850,1.0));
const sKey=new THREE.DirectionalLight(0xa9b4ff,1.1);sKey.position.set(6,10,8);showScene.add(sKey);
const sRim=new THREE.PointLight(0x7c3aed,2.2,40);sRim.position.set(-6,4,-4);showScene.add(sRim);
const sFill=new THREE.PointLight(0x22d3ee,1.3,40);sFill.position.set(6,2,4);showScene.add(sFill);
const showPlat=new THREE.Group();showScene.add(showPlat);
const sDisc=new THREE.Mesh(new THREE.CylinderGeometry(2.6,2.9,0.18,40),new THREE.MeshPhongMaterial({color:0x0c0826,emissive:0x14082e,shininess:40}));
sDisc.position.y=-0.05;showPlat.add(sDisc);
const sRing1=new THREE.Mesh(new THREE.TorusGeometry(3.1,0.02,6,60),new THREE.MeshBasicMaterial({color:0x7c3aed}));sRing1.rotation.x=Math.PI/2;sRing1.position.y=0.06;showPlat.add(sRing1);addSpin(sRing1,0.25);
const sRing2=new THREE.Mesh(new THREE.TorusGeometry(3.5,0.012,6,60),new THREE.MeshBasicMaterial({color:0x22d3ee}));sRing2.rotation.x=Math.PI/2;sRing2.position.y=0.04;showPlat.add(sRing2);addSpin(sRing2,-0.18);
const pcnt=240,parr=new Float32Array(pcnt*3);
for(let i=0;i<pcnt;i++){const r=4+Math.random()*16,a=Math.random()*6.28,y=Math.random()*16-2;parr[i*3]=Math.cos(a)*r;parr[i*3+1]=y;parr[i*3+2]=Math.sin(a)*r;}
const pgeo=new THREE.BufferGeometry();pgeo.setAttribute('position',new THREE.BufferAttribute(parr,3));
const showParts=new THREE.Points(pgeo,new THREE.PointsMaterial({color:0x9d7bff,size:0.07,transparent:true,opacity:0.7}));
showScene.add(showParts);
const showHolder=new THREE.Group();showHolder.position.y=0.06;showScene.add(showHolder);
let showHero=null,showRace='nexus';
function setShowcaseHero(raceId){
  if(raceId===showRace&&showHero)return;
  showRace=raceId;
  if(showHero){showHolder.remove(showHero);}
  showHero=mkHeroMesh(raceId);
  showHero.scale.setScalar(1.7);
  showHolder.add(showHero);
  const hd=HEROES[raceId];
  sRim.color.set(hd.col);
}
setShowcaseHero('nexus');
function updateShowcase(dt){
  showHolder.rotation.y+=dt*0.45;
  showParts.rotation.y-=dt*0.04;
  const t=performance.now()/1000;
  showParts.position.y=Math.sin(t*0.3)*0.4;
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  G.lastDt=dt;
  updateSpinners(dt);
  if(!G.running){
    updateShowcase(dt);
    renderer.render(showScene,showCam);
    return;
  }
  renderer.render(scene,camera);
  G.gameT+=dt;
  updateCam(dt);
  updateMines(dt);
  updateUnits(dt);
  updateProjs(dt);
  updateQueues(dt);
  updateEnemyEconomy(dt);
  G.waveT+=dt;
  if(G.waveT>=G.waveInt)spawnWave();
  G.uiT+=dt;if(G.uiT>0.4){G.uiT=0;updateBuildUI();}
  updateHUD();
  drawHUD(dt);
  drawMinimap();
}
requestAnimationFrame(loop);

// ── MENU ───────────────────────────────────────────────────────────────────
const raceKeys=Object.keys(RACES);
const rcards=document.getElementById('rcards');
let selRace=null;
const RACE_TAG={nexus:'FACTION // 01',vide:'FACTION // 02',cristal:'FACTION // 03',synth:'FACTION // 04'};

raceKeys.forEach((rk)=>{
  const rd=RACES[rk];
  const hd=HEROES[rk];
  const d=document.createElement('div');
  d.className='rcard';
  d.style.setProperty('--rc',rd.color);
  d.innerHTML=`
    <div class="preview" id="prev-${rk}"></div>
    <div class="selmark">● ENGAGÉ</div>
    <div class="rbody">
      <div class="rtag">${RACE_TAG[rk]}</div>
      <h3 style="color:${rd.color}">${rd.name}</h3>
      <p>${rd.desc}</p>
      <div class="stats"><span>POP <b>${rd.pop}</b></span><span>ESS <b>${rd.ess}</b></span><span>UNITÉS <b>${rd.units.length}</b></span></div>
      <div class="stats" style="margin-top:4px"><span style="color:${rd.color}">⚜ HÉROS</span> <b style="color:#b8a9e0">${hd.name}</b></div>
    </div>`;
  d.onclick=()=>{
    document.querySelectorAll('.rcard').forEach(c=>c.classList.remove('sel'));
    d.classList.add('sel');selRace=rk;
    const others=raceKeys.filter(r=>r!==rk);
    G.er=others[Math.floor(Math.random()*others.length)];
    G.race=rk;
    setShowcaseHero(rk);
    document.getElementById('startBtn').disabled=false;
  };
  rcards.appendChild(d);
});

// Static 3D hero previews rendered with the main renderer
function generateRacePreviews(){
  const W=356,H=240;
  SPIN_OFF=true;
  const pScene=new THREE.Scene();
  const pCam=new THREE.PerspectiveCamera(40,W/H,0.1,100);pCam.position.set(2.0,2.3,6.2);pCam.lookAt(0,1.3,0);
  pScene.add(new THREE.AmbientLight(0x2a1a55,1.2));
  const k=new THREE.DirectionalLight(0xc6cdff,1.25);k.position.set(3,6,5);pScene.add(k);
  const rim=new THREE.PointLight(0xffffff,2.6,24);rim.position.set(-3.5,2.5,-2);pScene.add(rim);
  const fill=new THREE.PointLight(0x22d3ee,0.8,24);fill.position.set(3,1,3);pScene.add(fill);
  const holder=new THREE.Group();pScene.add(holder);
  renderer.setClearColor(0x07041a,1);
  renderer.setSize(W,H,false);
  for(const rk of raceKeys){
    while(holder.children.length)holder.remove(holder.children[0]);
    const hero=mkHeroMesh(rk);hero.scale.setScalar(1.5);hero.rotation.y=-0.55;holder.add(hero);
    const pdisc=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.5,0.12,28),new THREE.MeshPhongMaterial({color:0x0c0826,emissive:new THREE.Color(RACES[rk].color).getHex(),emissiveIntensity:0.15,shininess:40}));holder.add(pdisc);
    rim.color.set(new THREE.Color(RACES[rk].color).getHex());
    renderer.render(pScene,pCam);
    try{const url=renderer.domElement.toDataURL('image/png');const el=document.getElementById('prev-'+rk);if(el){el.style.backgroundImage='url('+url+')';el.style.backgroundSize='cover';el.style.backgroundPosition='center';}}catch(e){}
  }
  renderer.setClearColor(0x000000,0);
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  SPIN_OFF=false;
}
generateRacePreviews();

document.getElementById('startBtn').onclick=()=>{
  if(selRace){
    G.activeMission=null;
    startGame();
  }
};
