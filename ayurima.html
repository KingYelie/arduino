const canvas=document.getElementById('c');

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth,innerHeight);

scene.fog=new THREE.Fog(0x040210,60,120);

sun.position.set(20,30,10);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.near=1;sun.shadow.camera.far=100;
sun.shadow.camera.left=-50;sun.shadow.camera.right=50;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
scene.add(sun);
const pt=new THREE.PointLight(0x3b0fa0,1.2,80);pt.position.set(0,15,0);scene.add(pt);

// Ground
const gmat=new THREE.MeshPhongMaterial({color:0x080418,shininess:5});
const gmesh=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP,40,40),gmat);
gmesh.rotation.x=-PI/2;gmesh.receiveShadow=true;scene.add(gmesh);

// Grid overlay
const gcv=document.createElement('canvas');gcv.width=gcv.height=512;
const gctx=gcv.getContext('2d');gctx.strokeStyle='rgba(80,40,160,0.13)';gctx.lineWidth=0.5;
for(let i=0;i<=GRID;i++){const p=i/GRID*512;gctx.beginPath();gctx.moveTo(p,0);gctx.lineTo(p,512);gctx.stroke();gctx.beginPath();gctx.moveTo(0,p);gctx.lineTo(512,p);gctx.stroke();}
const gtex=new THREE.CanvasTexture(gcv);
const govl=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP),new THREE.MeshBasicMaterial({map:gtex,transparent:true,opacity:0.6,depthWrite:false}));
govl.rotation.x=-PI/2;govl.position.y=0.01;scene.add(govl);

// HUD canvas (for floating numbers, health bars etc.)

function resizeHUD(){hcv.width=innerWidth;hcv.height=innerHeight;}
resizeHUD();

// Camera control
const cam={x:0,z:0,zoom:22,rot:0};
let keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  resizeHUD();
});
window.addEventListener('wheel',e=>{cam.zoom=clamp(cam.zoom+e.deltaY*0.03,8,50);});

function updateCam(dt){
  const spd=20*dt,rs=1.2*dt;
  if(keys['KeyW']||keys['ArrowUp'])cam.z-=spd;
  if(keys['KeyS']||keys['ArrowD'])cam.z+=spd;
  if(keys['KeyA']||keys['ArrowLeft'])cam.x-=spd;
  if(keys['KeyD']||keys['ArrowRight'])cam.x+=spd;
  if(keys['KeyQ'])cam.rot-=rs;if(keys['KeyE'])cam.rot+=rs;
  cam.x=clamp(cam.x,-MAP/2,MAP/2);cam.z=clamp(cam.z,-MAP/2,MAP/2);
  const a=cam.rot;const h=cam.zoom;const back=cam.zoom*0.8;
  camera.position.set(cam.x+Math.sin(a)*back,h,cam.z+Math.cos(a)*back);
  camera.lookAt(cam.x,0,cam.z);
}

// ── SOUNDS ────────────────────────────────────────────────────────────────
const actx=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,vol=0.12,type='sine',decay=0.8){
  if(actx.state==='suspended')actx.resume();
  const o=actx.createOscillator(),g=actx.createGain();
  o.connect(g);g.connect(actx.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur*decay);
  o.start();o.stop(actx.currentTime+dur);
}
const SND={

  build:()=>beep(880,0.12,0.09,'sine'),

  win:()=>{for(let i=0;i<5;i++)setTimeout(()=>beep(440+i*110,0.2,0.1,'sine'),i*120);},
  lose:()=>{for(let i=0;i<3;i++)setTimeout(()=>beep(200-i*40,0.3,0.1,'sawtooth'),i*200);}
};

// ── TOAST / LOG ───────────────────────────────────────────────────────────
function toast(msg,dur=2500){
  const d=document.getElementById('log');
  const m=document.createElement('div');m.className='logm';m.textContent=msg;d.appendChild(m);
  setTimeout(()=>{m.style.opacity='0';setTimeout(()=>m.remove(),1000);},dur);

}

// ── WORLD-SPACE UTILS ─────────────────────────────────────────────────────
const ray=new THREE.Raycaster();
const gPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
function getWorldPos(ex,ey){
  const nd=new THREE.Vector2((ex/innerWidth)*2-1,-(ey/innerHeight)*2+1);
  ray.setFromCamera(nd,camera);
  const t=new THREE.Vector3();
  ray.ray.intersectPlane(gPlane,t);
  return t;
}

function getEBase(){return G.blds.find(b=>b.team===2&&b.alive&&b.isBase);}

// ── PRODUCTION BUILDINGS ───────────────────────────────────────────────────
function hasBld(typeId){
  return G.pblds.some(b=>b.alive&&b.team===1&&b.typeId===typeId);
}

function buildPBld(typeId){
  const race=RACES[G.race];
  const def=race.bldgs.find(b=>b.id===typeId);
  if(!def){toast('Bâtiment inconnu');return;}
  if(G.ess<def.cost){toast('Essence insuffisante!');return;}
  if(def.bldReq&&!hasBld(def.bldReq)){
    const req=race.bldgs.find(b=>b.id===def.bldReq);
    toast('Requis: '+( req?req.name:def.bldReq));return;
  }
  // Max 2 of same type
  const existing=G.pblds.filter(b=>b.alive&&b.team===1&&b.typeId===typeId).length;
  if(existing>=2){toast('Maximum 2 de ce type!');return;}
  G.ess-=def.cost;
  const pb=getPBase();
  const slot=G.pblds.filter(b=>b.team===1&&b.alive).length;
  const angle=(slot*50+110)*PI/180;
  const r=9+Math.floor(slot/5)*3;
  const x=clamp(pb.x+Math.cos(angle)*r,-MAP/2+5,MAP/2-5);
  const z=clamp(pb.z+Math.sin(angle)*r,-MAP/2+5,MAP/2-5);
  spawnPBld(typeId,x,z,1);
  SND.build();toast(def.name+' construit!');
  updateBuildUI();
}

function spawnPBld(typeId,wx,wz,team){
  const race=RACES[team===1?G.race:G.er];
  const def=race.bldgs.find(b=>b.id===typeId);
  if(!def)return null;
  const hp=Math.floor(def.hp*(team===1?G.tb.bhm:1));
  const col=def.col;
  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(def.sz*2,def.sz*1.2,def.sz*2),
    new THREE.MeshPhongMaterial({color:col,emissive:new THREE.Color(col).multiplyScalar(0.25)})
  );
  mesh.position.set(wx,def.sz*0.6,wz);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);
  // Spire indicator
  const sp=new THREE.Mesh(
    new THREE.CylinderGeometry(0.1,0.1,3),
    new THREE.MeshBasicMaterial({color:col})
  );
  sp.position.set(0,def.sz*0.6+1.5,0);mesh.add(sp);
  const b={id:G.nid++,typeId,name:def.name,def,team,x:wx,z:wz,hp,maxHp:hp,mesh,alive:true,isPBld:true,queue:[],rally:null,vr:10};
  G.pblds.push(b);
  return b;
}

// ── UNIT PRODUCTION QUEUE ──────────────────────────────────────────────────
function queueUnit(bldId,unitId){
  const b=G.pblds.find(pb=>pb.id===bldId&&pb.alive&&pb.team===1);
  if(!b){toast('Bâtiment introuvable');return;}
  if(b.queue.length>=3){toast('File pleine! (max 3)');return;}
  const race=RACES[G.race];
  const ud=race.units.find(u=>u.id===unitId);
  if(!ud){toast('Unité inconnue');return;}
  if(ud.req&&!hasBld(ud.req)){toast('Bâtiment requis manquant');return;}
  if(G.ess<ud.cost){toast('Essence insuffisante!');return;}
  // Check pop cap
  const pendingPop=G.pblds.reduce((s,pb)=>s+pb.queue.reduce((qs,qi)=>{const u2=race.units.find(u=>u.id===qi.unitId);return qs+(u2?u2.pop:0);},0),0);
  if(G.pop+pendingPop>=G.maxPop){toast('Population max!');return;}
  G.ess-=ud.cost;
  const prod=8+(ud.cost/20);
  b.queue.push({unitId,name:ud.name,total:prod,prog:0,cost:ud.cost});
  updateBuildUI();
}

function cancelQueue(bldId,qi){
  const b=G.pblds.find(pb=>pb.id===bldId&&pb.alive&&pb.team===1);
  if(!b||!b.queue[qi])return;
  const q=b.queue[qi];
  G.ess+=Math.floor(q.cost*0.8);
  b.queue.splice(qi,1);
  toast('Production annulée, 80% remboursé');
  updateBuildUI();
}

function updateQueues(dt){
  const race=RACES[G.race];
  for(const b of G.pblds){
    if(!b.alive||!b.queue.length)continue;
    const q=b.queue[0];q.prog+=dt;
    if(q.prog>=q.total){
      b.queue.shift();
      const rx=b.rally?b.rally.x:b.x+rr(-3,3);
      const rz=b.rally?b.rally.z:b.z+rr(-3,3);
      if(b.team===1){
        const u=spawnUnit(q.unitId,G.race,b.x,b.z,1);
        if(u){u.dest={x:rx,z:rz};}
        SND.build();
        toast(q.name+' prêt!',1500);
      }
    }
  }
}

// ── UNITS ─────────────────────────────────────────────────────────────────
function spawnUnit(uid,race,wx,wz,team){
  const rd=RACES[race];
  const ud=rd.units.find(u=>u.id===uid);
  if(!ud)return null;
  const eff=team===1?G.tb:G.eb;
  const hp=Math.floor(ud.hp*eff.bhm);
  const col=new THREE.Color(ud.col);
  const sz=0.35+ud.pop*0.12;
  const geo=ud.stationary?new THREE.BoxGeometry(sz*2,sz*1.5,sz*2):new THREE.CylinderGeometry(sz*0.4,sz*0.6,sz*1.4,6);
  const mat=new THREE.MeshPhongMaterial({color:col,emissive:col.clone().multiplyScalar(0.18),shininess:40});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(wx+rr(-1,1),sz*0.7,wz+rr(-1,1));
  mesh.castShadow=true;scene.add(mesh);
  // Team indicator ring
  const ring=new THREE.Mesh(new THREE.TorusGeometry(sz*0.7,0.06,6,12),new THREE.MeshBasicMaterial({color:team===1?0x4ade80:0xf87171}));
  ring.rotation.x=PI/2;ring.position.y=-sz*0.65;mesh.add(ring);
  const u={
    id:G.nid++,uid,name:ud.name,race,team,
    x:mesh.position.x,z:mesh.position.z,
    hp,maxHp:hp,
    atk:Math.floor(ud.atk*(eff.em||1)),
    rng:ud.rng,
    spd:ud.spd*(eff.asm||1),
    rep:ud.rep,
    repT:0,
    mesh,sz,
    alive:true,
    harvester:!!ud.harvester,
    stationary:!!ud.stationary,
    dest:null,
    target:null,
    harvT:0,
    harv:null,
    poisonT:0,
    sdb:eff.sdb||0,
    pop:ud.pop
  };
  G.units.push(u);
  G.pop+=ud.pop;
  return u;
}

function removeUnit(u){
  if(!u.alive)return;
  u.alive=false;
  scene.remove(u.mesh);
  G.pop-=u.pop;
  if(G.pop<0)G.pop=0;
}

// ── AI SPAWN ───────────────────────────────────────────────────────────────
function getAIUnits(){
  const rd=RACES[G.er];
  // Enemy builds its own buildings over time, simplified: just track hasBld for enemy
  const hasBldE=(typeId)=>G.pblds.some(b=>b.alive&&b.team===2&&b.typeId===typeId);
  const avail=rd.units.filter(u=>{
    if(!u.req)return true;
    return hasBldE(u.req);
  });
  if(!avail.length)return [rd.units[0]];
  return avail;
}

function spawnWave(){
  G.wave++;
  const eb=getEBase();if(!eb)return;
  const rd=RACES[G.er];
  const avail=getAIUnits();
  const count=3+G.wave*2;
  SND.wave();toast(`⚔ Vague ${G.wave} ennemie!`,3000);
  for(let i=0;i<count;i++){
    const ud=avail[Math.floor(Math.random()*avail.length)];
    const ex=eb.x+rr(-5,5),ez=eb.z+rr(-5,5);
    setTimeout(()=>{if(!G.over)spawnUnit(ud.id,G.er,ex,ez,2);},i*300);
  }
  // Enemy occasionally builds production buildings
  if(G.wave%2===0){
    const bldgs=rd.bldgs;
    const toBuild=bldgs.filter(b=>{
      if(b.bldReq&&!G.pblds.some(pb=>pb.alive&&pb.team===2&&pb.typeId===b.bldReq))return false;
      const existing=G.pblds.filter(pb=>pb.alive&&pb.team===2&&pb.typeId===b.id).length;
      return existing<1;
    });
    if(toBuild.length){
      const bd=toBuild[0];
      const slot=G.pblds.filter(b=>b.team===2&&b.alive).length;
      const angle=(slot*55+250)*PI/180;
      const r=8+Math.floor(slot/4)*3;
      const x=clamp(eb.x+Math.cos(angle)*r,-MAP/2+5,MAP/2-5);
      const z=clamp(eb.z+Math.sin(angle)*r,-MAP/2+5,MAP/2-5);
      spawnPBld(bd.id,x,z,2);
    }
  }
  G.waveT=0;G.waveInt=Math.max(22,G.waveInt-1.5);
}

// ── DAMAGE & PROJECTILES ──────────────────────────────────────────────────
function addFloat(x,z,val,col){
  G.floats.push({x,z,val,life:1.2,col,vy:3});
}

function dealDmg(attacker,target,amount){
  if(!target||!target.alive)return;
  // Reflection
  const att=attacker.team===1?G.tb:G.eb;
  const def=target.team===1?G.tb:G.eb;
  if(def.ref>0&&Math.random()<def.ref){
    // Reflect back
    if(attacker.alive)dealDmg(null,attacker,Math.floor(amount*0.4));
    addFloat(target.x||0,target.z||0,'↩',attacker.team===1?'#4ade80':'#f87171');
    return;
  }
  // Poison
  if(att.poison&&target.hp!==undefined){
    target.poisonT=(target.poisonT||0)+4;
  }
  // Bonus dice
  if(att.sdb>0)amount+=rr(0,att.sdb)|0;
  target.hp-=amount;
  if(amount>0&&(target.x!==undefined||target.mesh)){
    const tx=target.x!==undefined?target.x:(target.mesh?target.mesh.position.x:0);
    const tz=target.z!==undefined?target.z:(target.mesh?target.mesh.position.z:0);
    addFloat(tx,tz,Math.floor(amount),target.team===1?'#f87171':'#fde047');
  }
  if(target.hp<=0){
    target.hp=0;
    if(target.isPBld){
      // Production building destroyed
      target.alive=false;
      scene.remove(target.mesh);
      // Refund 50% of queue
      const race=RACES[target.team===1?G.race:G.er];
      let refund=0;
      for(const q of target.queue){refund+=Math.floor(q.cost*0.5);}
      if(target.team===1){
        G.ess+=refund;
        if(refund>0)toast(`Bâtiment détruit! +${refund} essence récupérée`);
        else toast(`${target.name} détruit!`);
        if(G.selBld===target.id){G.selBld=null;updateBuildUI();}
      }
    } else if(target.alive!==undefined&&!target.isPBld&&!target.isBase){
      // Regular unit
      if(target.alive){
        // Drain on kill
        if(attacker&&att.de>0&&attacker.team!==target.team){
          G.ess=Math.min(9999,G.ess+(att.de));
        }
        removeUnit(target);
      }
    } else if(target.isBase){
      target.alive=false;
      target.hp=0;
      scene.remove(target.mesh);
      if(target.team===1){endGame(false);}
      else{endGame(true);}
    }
  }
}

function spawnProj(from,to,col,dmg){
  const geo=new THREE.SphereGeometry(0.12,4,4);
  const mat=new THREE.MeshBasicMaterial({color:col});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(from.x||from.mesh.position.x,0.8,from.z||from.mesh.position.z);
  scene.add(m);
  const tx=to.x!==undefined?to.x:to.mesh.position.x;
  const tz=to.z!==undefined?to.z:to.mesh.position.z;
  G.projs.push({mesh:m,tx,tz,dmg,target:to,spd:16,done:false});
}

function updateProjs(dt){
  for(const p of G.projs){
    if(p.done)continue;
    const dx=p.tx-p.mesh.position.x,dz=p.tz-p.mesh.position.z;
    const d=Math.hypot(dx,dz);
    if(d<0.3){
      dealDmg(null,p.target,p.dmg);
      scene.remove(p.mesh);p.done=true;
    } else {
      const s=Math.min(p.spd*dt,d);
      p.mesh.position.x+=dx/d*s;p.mesh.position.z+=dz/d*s;
    }
  }
  G.projs=G.projs.filter(p=>!p.done);
}

// ── FIND ENEMY ────────────────────────────────────────────────────────────
function findEnemy(u){
  const et=u.team===1?2:1;
  let best=null,bd=u.rng*1.8;
  // Check units
  for(const t of G.units){
    if(!t.alive||t.team!==et)continue;
    const d=dst(u,t);
    if(d<bd){bd=d;best=t;}
  }
  // Check base buildings
  if(!best){
    for(const b of G.blds){
      if(!b.alive||b.team!==et)continue;
      const d=dst2(u.x,u.z,b.x,b.z);
      if(d<u.rng*1.8&&d<bd){bd=d;best=b;}
    }
  }
  // Check production buildings
  if(!best){
    for(const pb of G.pblds){
      if(!pb.alive||pb.team!==et)continue;
      const d=dst2(u.x,u.z,pb.x,pb.z);
      if(d<u.rng*1.8&&d<bd){bd=d;best=pb;}
    }
  }
  return best;
}

function findMine(u){
  let best=null,bd=MINE_RANGE+u.rng;
  for(const m of G.mines){
    if(m.ess<=0)continue;
    const d=dst2(u.x,u.z,m.x,m.z);
    if(d<bd){bd=d;best=m;}
  }
  return best;
}

// ── UNIT AI ───────────────────────────────────────────────────────────────
function updateUnits(dt){
  const race=RACES[G.race];
  for(const u of G.units){
    if(!u.alive)continue;
    // Poison tick
    if(u.poisonT>0){
      u.poisonT-=dt;
      u.hp-=2*dt;
      if(u.hp<=0){removeUnit(u);continue;}
    }
    // Regen
    const eff=u.team===1?G.tb:G.eb;
    if(eff.regen>0&&u.hp<u.maxHp){u.hp=Math.min(u.maxHp,u.hp+eff.regen*dt);}
    // Attack cooldown
    u.repT=Math.max(0,u.repT-dt);
    // Harvester logic
    if(u.harvester&&u.team===1){
      if(!u.harv){u.harv=findMine(u);}
      if(u.harv&&u.harv.ess<=0)u.harv=null;
      if(u.harv){
        const d=dst2(u.x,u.z,u.harv.x,u.harv.z);
        if(d>MINE_RANGE){moveToward(u,u.harv.x,u.harv.z,dt);}
        else{
          u.harvT+=dt;
          if(u.harvT>=HARV_INT){
            u.harvT=0;
            const gain=Math.min(u.harv.ess,rr(6,14)|0);
            u.harv.ess-=gain;
            G.ess+=gain;
            if(G.tb.de>0)G.ess+=G.tb.de*0.1|0;
          }
        }
        continue;
      }
    }
    // Combat
    if(!u.stationary){
      if(u.target&&(!u.target.alive||u.target.hp<=0)){u.target=null;}
      if(!u.target)u.target=findEnemy(u);
      if(u.target){
        const td=dst(u,u.target)||dst2(u.x,u.z,u.target.x||0,u.target.z||0);
        if(td>u.rng){moveToward(u,u.target.x||0,u.target.z||0,dt);}
        else if(u.repT<=0){
          u.repT=u.rep;SND.atk();
          spawnProj(u,u.target,u.team===1?0x60a5fa:0xf87171,u.atk);
        }
      } else if(u.dest){
        const d=dst2(u.x,u.z,u.dest.x,u.dest.z);
        if(d>0.5)moveToward(u,u.dest.x,u.dest.z,dt);
        else u.dest=null;
      } else if(u.team===2){
        // Enemy AI: move toward player base
        const pb=getPBase();
        if(pb)moveToward(u,pb.x+rr(-3,3),pb.z+rr(-3,3),dt);
      }
    } else {
      // Stationary: shoot
      if(u.target&&!u.target.alive)u.target=null;
      if(!u.target)u.target=findEnemy(u);
      if(u.target&&u.repT<=0){
        u.repT=u.rep;SND.atk();
        spawnProj(u,u.target,u.team===1?0x60a5fa:0xf87171,u.atk);
      }
    }
    // Sync mesh
    if(!u.stationary){u.mesh.position.set(u.x,u.sz*0.7,u.z);}
  }
  // Remove dead
  for(const u of G.units){if(!u.alive)continue;if(u.hp<=0)removeUnit(u);}
}

function moveToward(u,tx,tz,dt){
  const dx=tx-u.x,dz=tz-u.z;
  const d=Math.hypot(dx,dz);
  if(d<0.1)return;
  const s=Math.min(u.spd*dt,d);
  u.x+=dx/d*s;u.z+=dz/d*s;
}

// ── MINES UPDATE ──────────────────────────────────────────────────────────
function updateMines(dt){
  for(const m of G.mines){
    m.mesh.rotation.y+=dt*0.6;
    if(m.ess<m.maxEss){m.ess=Math.min(m.maxEss,m.ess+m.regen*dt);}
    const t=m.ess/m.maxEss;
    m.mesh.material.opacity=0.3+0.7*t;
    m.mesh.material.emissiveIntensity=t;
  }
}

// ── ENEMY HARVESTER ───────────────────────────────────────────────────────
let eHarvT=0;
function updateEnemyEconomy(dt){
  eHarvT+=dt;
  if(eHarvT>=3){eHarvT=0;G.ess=Math.min(9999,G.ess+8);}
}

// ── START GAME ────────────────────────────────────────────────────────────
function startGame(){
  G.pblds=[];G.selBld=null;G.floats=[];G.uiT=0;
  G.ess=RACES[G.race].ess;
  G.maxPop=RACES[G.race].pop+(G.tb.pop||0);
  G.pop=0;G.wave=0;G.waveT=0;G.waveInt=40;
  G.running=true;G.over=false;
  G.units=[];G.blds=[];G.projs=[];G.mines=[];G.sel=[];
  G.tech={};
  // Init bonus multipliers
  G.tb={bhm:1,ref:0,regen:0,de:0,em:1,asm:1,sdb:0,poison:false,novaUp:false,pop:0};
  G.eb={bhm:1,ref:0,regen:0,de:0,em:1,asm:1,sdb:0,poison:false,pop:0};
  spawnMines();
  // Player base bottom
  const pb=spawnBase(G.race,-2,32,1);
  // Enemy base top
  const eb=spawnBase(G.er,2,-32,2);
  // Spawn initial harvesters
  const rd=RACES[G.race];
  const harvUnit=rd.units.find(u=>u.harvester&&!u.req);
  if(harvUnit){
    for(let i=0;i<2;i++)spawnUnit(harvUnit.id,G.race,pb.x+rr(-3,3),pb.z+rr(-3,3),1);
  }
  // Spawn enemy initial units
  const erd=RACES[G.er];
  const eHarv=erd.units.find(u=>u.harvester&&!u.req);
  if(eHarv){
    for(let i=0;i<2;i++)spawnUnit(eHarv.id,G.er,eb.x+rr(-2,2),eb.z+rr(-2,2),2);
  }
  // Spawn enemy first building
  const firstBldg=erd.bldgs[0];
  if(firstBldg){
    const bx=clamp(eb.x+7,-MAP/2+5,MAP/2-5);
    const bz=clamp(eb.z,-MAP/2+5,MAP/2-5);
    spawnPBld(firstBldg.id,bx,bz,2);
  }
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('panel').style.display='block';
  document.getElementById('ifo').style.display='block';
  cam.x=pb.x;cam.z=pb.z+5;
  updateBuildUI();
}

// ── TECH ──────────────────────────────────────────────────────────────────
function buyTech(tid){
  const td=RACES[G.race].tech.find(t=>t.id===tid);
  if(!td||G.tech[tid])return;
  if(G.ess<td.cost){toast('Essence insuffisante!');return;}
  G.ess-=td.cost;G.tech[tid]=true;
  const ef=td.ef;
  if(ef.atk){for(const u of G.units)if(u.team===1)u.atk=Math.floor(u.atk*ef.atk);}
  if(ef.bhm)G.tb.bhm*=ef.bhm;
  if(ef.ref)G.tb.ref=Math.min(0.5,G.tb.ref+(ef.ref||0));
  if(ef.regen)G.tb.regen+=(ef.regen||0);
  if(ef.pop){G.tb.pop=(G.tb.pop||0)+(ef.pop||0);G.maxPop+=ef.pop;}
  if(ef.poison)G.tb.poison=true;
  if(ef.de)G.tb.de+=(ef.de||0);
  if(ef.em)G.tb.em*=ef.em;
  if(ef.asm)G.tb.asm*=ef.asm;
  if(ef.sdb)G.tb.sdb+=(ef.sdb||0);
  if(ef.novaUp)G.tb.novaUp=true;
  toast(`Tech: ${td.name} activée!`);
  updateBuildUI();
}

// ── UI ─────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('ess').textContent='✦ '+G.ess;
  document.getElementById('pop').textContent='⬡ '+G.pop+'/'+G.maxPop;
  document.getElementById('wave').textContent='Vague '+(G.wave+1);
  const s=Math.floor(G.gameT);
  const m=Math.floor(s/60).toString().padStart(2,'0');
  const sec=(s%60).toString().padStart(2,'0');
  document.getElementById('timer').textContent=m+':'+sec;
}

function updateSelUI(){
  const ifo=document.getElementById('ifo');
  if(!G.sel.length){ifo.innerHTML='<span style="color:#3d2f6e;font-size:10px">Clic gauche: sélectionner<br>Clic droit: déplacer<br>Molette: zoom<br>WASD: caméra</span>';return;}
  const u=G.units.find(u=>u.id===G.sel[0]);
  if(!u){ifo.innerHTML='';return;}
  const hp=u.maxHp>0?(u.hp/u.maxHp*100).toFixed(0):0;
  ifo.innerHTML=`
    <div style="font-size:12px;font-weight:700;color:#c4b5fd;margin-bottom:4px">${u.name} ×${G.sel.length}</div>
    <div style="background:#1a0f3a;height:5px;border-radius:2px;overflow:hidden;margin-bottom:4px">
      <div style="width:${hp}%;height:100%;background:linear-gradient(90deg,#ef4444,#fde047,#4ade80);background-size:200%"></div>
    </div>
    <div style="font-size:10px;color:#6b5fa0">HP: ${u.hp|0}/${u.maxHp} | ATK: ${u.atk}</div>
    <div style="font-size:10px;color:#6b5fa0">RNG: ${u.rng.toFixed(1)} | SPD: ${u.spd.toFixed(1)}</div>
    ${G.sel.length>1?`<div style="font-size:10px;color:#3d2f6e;margin-top:3px">${G.sel.length} unités sélectionnées</div>`:''}
  `;
}

function updateBuildUI(){
  const panel=document.getElementById('panel');
  if(!G.running){panel.innerHTML='';return;}
  const race=RACES[G.race];
  // If a building is selected, show building panel
  if(G.selBld!==null){
    const b=G.pblds.find(pb=>pb.id===G.selBld&&pb.alive);
    if(!b){G.selBld=null;updateBuildUI();return;}
    const hp=(b.hp/b.maxHp*100).toFixed(0);
    let qHtml='<div class="qrow">';
    for(let i=0;i<3;i++){
      const q=b.queue[i];
      if(q){
        const pct=(q.prog/q.total*100).toFixed(0);
        qHtml+=`<div class="qslot${i===0?' active':''}" onclick="cancelQueue(${b.id},${i})" title="Clic pour annuler">
          <div class="qsn">${q.name}</div>
          <div class="qsc">✕</div>
          ${i===0?`<div class="qsp" style="width:${pct}%"></div>`:''}
        </div>`;
      } else {
        qHtml+=`<div class="qslot"><div class="qsn" style="color:#374151">–</div></div>`;
      }
    }
    qHtml+='</div>';
    // Units produceable by this building
    const produceable=race.units.filter(u=>u.req===b.typeId);
    let uHtml='';
    for(const ud of produceable){
      const canAfford=G.ess>=ud.cost;
      const qFull=b.queue.length>=3;
      const dis=!canAfford||qFull;
      uHtml+=`<button class="pbtn2${dis?' dis':''}" onclick="queueUnit(${b.id},'${ud.id}')" ${dis?'disabled':''}>
        <div class="pbtn-name">${ud.name} <span style="color:#6b5fa0">(pop:${ud.pop})</span></div>
        <div class="pbtn-cost">✦ ${ud.cost} · ${(8+ud.cost/20).toFixed(0)}s</div>
        <div class="pbtn-sub">${ud.desc}</div>
      </button>`;
    }
    panel.innerHTML=`
      <div class="bsel">
        <div class="bsel-name">${b.name}</div>
        <div class="bhp-bg"><div class="bhp-f" style="width:${hp}%"></div></div>
        <div style="font-size:9px;color:#4b5563;margin-bottom:4px">HP: ${b.hp|0}/${b.maxHp}</div>
        ${qHtml}
        <button class="rally-btn" onclick="setRallyMode()">📍 Point de ralliement</button>
      </div>
      <div class="panel-sec">
        <div class="sec-hd">PRODUIRE</div>
        ${uHtml||'<div style="font-size:9px;color:#4b5563">Aucune unité disponible</div>'}
      </div>
      <div class="panel-sec">
        <div style="font-size:9px;color:#6b5fa0;cursor:pointer;padding:3px 0;" onclick="G.selBld=null;updateBuildUI()">← Retour</div>
      </div>
    `;
    return;
  }
  // Default panel: buildings + units + tech
  let bHtml='';
  for(const bd of race.bldgs){
    const prereqOk=!bd.bldReq||hasBld(bd.bldReq);
    const existing=G.pblds.filter(b=>b.alive&&b.team===1&&b.typeId===bd.id).length;
    const maxed=existing>=2;
    const canAfford=G.ess>=bd.cost;
    const dis=!canAfford||!prereqOk||maxed;
    const lk=!prereqOk;
    bHtml+=`<button class="pbtn${lk?' lk':dis?' dis':''}" onclick="buildPBld('${bd.id}')" ${dis?'disabled':''}>
      <div class="pbtn-name">${bd.name}${maxed?' <span style="color:#4ade80">(2/2)</span>':' <span style="color:#374151">('+existing+'/2)</span>'}</div>
      <div class="pbtn-cost">✦ ${bd.cost}${bd.bldReq&&!prereqOk?' <span style="color:#f87171">· Requis: '+race.bldgs.find(b=>b.id===bd.bldReq)?.name+'</span>':''}</div>
      <div class="pbtn-sub">${bd.desc}</div>
    </button>`;
  }
  // Units (harvesters + those with no req always show; others show with lock if no building)
  let uHtml='';
  for(const ud of race.units){
    const canAfford=G.ess>=ud.cost;
    const popFull=G.pop>=G.maxPop;
    const bldOk=!ud.req||hasBld(ud.req);
    const dis=!canAfford||popFull||!bldOk;
    const lk=!bldOk;
    uHtml+=`<button class="pbtn${lk?' lk':dis?' dis':''}" onclick="spawnDirect('${ud.id}')" ${dis?'disabled':''}>
      <div class="pbtn-name">${lk?'🔒 ':''} ${ud.name} <span style="color:#6b5fa0">(pop:${ud.pop})</span></div>
      <div class="pbtn-cost">✦ ${ud.cost}${lk&&ud.req?' <span style="color:#f87171">· '+race.bldgs.find(b=>b.id===ud.req)?.name+'</span>':''}</div>
      <div class="pbtn-sub">${ud.desc}</div>
    </button>`;
  }
  // Tech
  let tHtml='<div class="tech-grid">';
  for(const t of race.tech){
    const done=!!G.tech[t.id];
    const dis=!done&&G.ess<t.cost;
    tHtml+=`<button class="tbtn${done?' done':dis?' dis':''}" onclick="buyTech('${t.id}')" ${done||dis?'disabled':''}>
      <div style="font-weight:700;font-size:10px">${t.name}</div>
      <div style="font-size:8px;color:#6b5fa0">${done?'✓ Actif':'✦ '+t.cost}</div>
      <div style="font-size:7px;margin-top:1px">${t.desc}</div>
    </button>`;
  }
  tHtml+='</div>';
  panel.innerHTML=`
    <div style="font-size:10px;font-weight:700;color:#7c3aed;margin-bottom:5px;letter-spacing:.5px">⬡ RACE: ${race.name}</div>
    <div class="panel-sec" style="border-top:none;padding-top:0">
      <div class="sec-hd">BÂTIMENTS</div>
      ${bHtml}
    </div>
    <div class="panel-sec">
      <div class="sec-hd">UNITÉS (spawn direct)</div>
      ${uHtml}
    </div>
    <div class="panel-sec">
      <div class="sec-hd">TECHNOLOGIE</div>
      ${tHtml}
    </div>
  `;
}

// Direct spawn (old-style, no building required for harvesters)
function spawnDirect(uid){
  const rd=RACES[G.race];
  const ud=rd.units.find(u=>u.id===uid);
  if(!ud)return;
  if(G.ess<ud.cost){toast('Essence insuffisante!');return;}
  if(G.pop>=G.maxPop){toast('Population maximale!');return;}
  if(ud.req&&!hasBld(ud.req)){
    const req=rd.bldgs.find(b=>b.id===ud.req);
    toast('Requis: '+(req?req.name:ud.req));return;
  }
  G.ess-=ud.cost;
  const pb=getPBase();
  spawnUnit(uid,G.race,pb?pb.x+rr(-3,3):rr(-5,5),pb?pb.z+rr(-2,2):rr(-5,5),1);
  SND.build();toast(ud.name+' déployé!',1200);
  updateBuildUI();
}

function setRallyMode(){
  G.rallyMode=true;
  toast('Clic droit pour placer le point de ralliement',2000);
}

// ── SELECTION & INPUT ─────────────────────────────────────────────────────
let dragStart=null,dragging=false;
const selBox={el:null};

function onMouseDown(e){
  if(e.button===2){
    e.preventDefault();
    const wp=getWorldPos(e.clientX,e.clientY);
    if(!wp)return;
    // Rally mode
    if(G.rallyMode&&G.selBld!==null){
      const b=G.pblds.find(pb=>pb.id===G.selBld&&pb.alive);
      if(b){
        b.rally={x:wp.x,z:wp.z};
        // Visual indicator
        if(b.rallyMesh)scene.remove(b.rallyMesh);
        const rm=new THREE.Mesh(new THREE.SphereGeometry(0.3,6,6),new THREE.MeshBasicMaterial({color:0x4ade80}));
        rm.position.set(wp.x,0.3,wp.z);scene.add(rm);b.rallyMesh=rm;
        toast('Point de ralliement placé!',1200);
      }
      G.rallyMode=false;
      return;
    }
    // Move selected units
    if(G.sel.length>0){
      SND.move();
      const cx=wp.x,cz=wp.z;
      const n=G.sel.length;
      G.sel.forEach((id,i)=>{
        const u=G.units.find(u=>u.id===id);
        if(u&&!u.stationary){
          const angle=(i/n)*2*PI;
          const r=i===0?0:1.5;
          u.dest={x:cx+Math.cos(angle)*r,z:cz+Math.sin(angle)*r};
          u.target=null;
        }
      });
    }
    return;
  }
  if(e.button===0){
    dragStart={x:e.clientX,y:e.clientY};
    dragging=false;
  }
}

function onMouseMove(e){
  if(dragStart&&e.button===0||dragStart&&(e.buttons&1)){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)>5){
      dragging=true;
      // Draw selection box
      if(!selBox.el){
        const d=document.createElement('div');
        d.style.cssText='position:fixed;border:1px solid #7c3aed;background:rgba(124,58,237,.08);pointer-events:none;z-index:10';
        document.body.appendChild(d);selBox.el=d;
      }
      const l=Math.min(dragStart.x,e.clientX);
      const t=Math.min(dragStart.y,e.clientY);
      const w=Math.abs(dx),h=Math.abs(dy);
      selBox.el.style.left=l+'px';selBox.el.style.top=t+'px';
      selBox.el.style.width=w+'px';selBox.el.style.height=h+'px';
    }
  }
}

function onMouseUp(e){
  if(e.button===0){
    if(selBox.el){document.body.removeChild(selBox.el);selBox.el=null;}
    if(dragging&&dragStart){
      // Box select units
      const x1=Math.min(dragStart.x,e.clientX),x2=Math.max(dragStart.x,e.clientX);
      const y1=Math.min(dragStart.y,e.clientY),y2=Math.max(dragStart.y,e.clientY);
      G.sel=[];G.selBld=null;
      for(const u of G.units){
        if(!u.alive||u.team!==1)continue;
        const sp=worldToScreen(u.x,u.z);
        if(sp&&sp.x>=x1&&sp.x<=x2&&sp.y>=y1&&sp.y<=y2)G.sel.push(u.id);
      }
      if(G.sel.length)SND.sel();
      dragging=false;dragStart=null;
      updateSelUI();updateBuildUI();
      return;
    }
    dragStart=null;dragging=false;
    // Click select
    const wp=getWorldPos(e.clientX,e.clientY);
    if(!wp)return;
    // Check player production buildings
    for(const pb of G.pblds){
      if(pb.alive&&pb.team===1&&dst2(pb.x,pb.z,wp.x,wp.z)<pb.def.sz+1){
        G.selBld=pb.id;G.sel=[];SND.sel();
        updateBuildUI();updateSelUI();return;
      }
    }
    // Check units
    let closest=null,cbest=2.5;
    for(const u of G.units){
      if(!u.alive||u.team!==1)continue;
      const d=dst2(u.x,u.z,wp.x,wp.z);
      if(d<cbest){cbest=d;closest=u;}
    }
    if(closest){
      if(!e.shiftKey)G.sel=[closest.id];
      else if(!G.sel.includes(closest.id))G.sel.push(closest.id);
      SND.sel();G.selBld=null;
    } else {
      // Deselect
      G.sel=[];G.selBld=null;
    }
    updateSelUI();updateBuildUI();
  }
}

function worldToScreen(wx,wz){
  const v=new THREE.Vector3(wx,0.8,wz);
  v.project(camera);
  if(v.z>1)return null;
  return{x:(v.x+1)/2*innerWidth,y:(-v.y+1)/2*innerHeight};
}

window.addEventListener('mousedown',onMouseDown);
window.addEventListener('mousemove',onMouseMove);
window.addEventListener('mouseup',onMouseUp);
window.addEventListener('contextmenu',e=>e.preventDefault());

// ── HUD DRAW ──────────────────────────────────────────────────────────────
function drawHUD(dt){
  hctx.clearRect(0,0,hcv.width,hcv.height);
  // Draw health bars
  for(const u of G.units){
    if(!u.alive)continue;
    const sp=worldToScreen(u.x,u.z);if(!sp)continue;
    const w=28,h=3;
    const pct=u.hp/u.maxHp;
    hctx.fillStyle='rgba(0,0,0,0.5)';
    hctx.fillRect(sp.x-w/2,sp.y-14,w,h);
    hctx.fillStyle=u.team===1?`hsl(${120*pct},80%,45%)`:'#ef4444';
    hctx.fillRect(sp.x-w/2,sp.y-14,w*pct,h);
    // Selection indicator
    if(G.sel.includes(u.id)){
      hctx.strokeStyle='#4ade80';hctx.lineWidth=1.5;
      hctx.strokeRect(sp.x-14,sp.y-12,28,24);
    }
  }
  // Draw building health bars
  for(const b of [...G.blds,...G.pblds]){
    if(!b.alive)continue;
    const sp=worldToScreen(b.x,b.z);if(!sp)continue;
    const w=36,h=4;
    const pct=b.hp/b.maxHp;
    hctx.fillStyle='rgba(0,0,0,0.6)';
    hctx.fillRect(sp.x-w/2,sp.y-20,w,h);
    hctx.fillStyle=b.team===1?`hsl(${120*pct},70%,45%)`:'#dc2626';
    hctx.fillRect(sp.x-w/2,sp.y-20,w*pct,h);
    // Building selection
    if(G.selBld===b.id){
      hctx.strokeStyle='#38bdf8';hctx.lineWidth=2;
      hctx.strokeRect(sp.x-18,sp.y-22,36,28);
    }
    // Queue progress
    if(b.isPBld&&b.queue.length>0){
      const q=b.queue[0];
      const qpct=q.prog/q.total;
      hctx.fillStyle='rgba(0,0,0,0.5)';
      hctx.fillRect(sp.x-w/2,sp.y-14,w,3);
      hctx.fillStyle='#fde047';
      hctx.fillRect(sp.x-w/2,sp.y-14,w*qpct,3);
    }
  }
  // Draw floating damage numbers
  G.floats=G.floats.filter(f=>f.life>0);
  for(const f of G.floats){
    f.life-=dt;
    f.z-=f.vy*dt;
    const sp=worldToScreen(f.x,f.z);
    if(!sp)continue;
    const alpha=Math.max(0,f.life/1.2);
    hctx.save();
    hctx.globalAlpha=alpha;
    hctx.font=`bold ${10+Math.floor((1-f.life/1.2)*4)}px Segoe UI`;
    hctx.fillStyle=f.col;
    hctx.textAlign='center';
    hctx.shadowColor=f.col;hctx.shadowBlur=4;
    hctx.fillText(f.val,sp.x,sp.y-20*(1-f.life/1.2));
    hctx.restore();
  }
  // Rally point indicators
  if(G.selBld!==null){
    const b=G.pblds.find(pb=>pb.id===G.selBld&&pb.alive);
    if(b&&b.rally){
      const sp=worldToScreen(b.rally.x,b.rally.z);
      if(sp){
        hctx.fillStyle='#4ade80';hctx.font='14px Segoe UI';
        hctx.textAlign='center';hctx.fillText('📍',sp.x,sp.y);
      }
    }
  }
  // Rally mode hint
  if(G.rallyMode){
    hctx.fillStyle='rgba(74,222,128,0.8)';
    hctx.font='bold 13px Segoe UI';
    hctx.textAlign='center';
    hctx.fillText('Clic droit pour placer le point de ralliement',innerWidth/2,40);
  }
  // Mine labels
  for(const m of G.mines){
    if(m.ess<1)continue;
    const sp=worldToScreen(m.x,m.z);if(!sp)continue;
    hctx.fillStyle='rgba(167,139,250,0.85)';
    hctx.font='9px Segoe UI';hctx.textAlign='center';
    hctx.fillText('✦'+Math.floor(m.ess),sp.x,sp.y+20);
  }
}

// ── GAME OVER ─────────────────────────────────────────────────────────────
function endGame(won){
  if(G.over)return;
  G.over=true;G.running=false;
  const over=document.getElementById('over');
  over.style.display='flex';
  document.getElementById('overT').textContent=won?'VICTOIRE!':'DÉFAITE';
  document.getElementById('overT').className='over-title '+(won?'win':'lose');
  document.getElementById('overS').textContent=won
    ?`Vague ${G.wave} | Temps: ${Math.floor(G.gameT/60)}m${Math.floor(G.gameT%60)}s`
    :'Votre base a été détruite...';
  if(won)SND.win();else SND.lose();
}

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,0.05);lastT=t;
  G.lastDt=dt;
  renderer.render(scene,camera);
  if(!G.running){return;}
  G.gameT+=dt;
  updateCam(dt);
  updateMines(dt);
  updateUnits(dt);
  updateProjs(dt);
  updateQueues(dt);
  updateEnemyEconomy(dt);
  // Wave timer
  G.waveT+=dt;
  if(G.waveT>=G.waveInt)spawnWave();
  // UI timer
  G.uiT+=dt;if(G.uiT>0.4){G.uiT=0;updateBuildUI();}
  updateHUD();
  drawHUD(dt);
}
requestAnimationFrame(loop);

// ── MENU ───────────────────────────────────────────────────────────────────
const raceKeys=Object.keys(RACES);
const rcards=document.getElementById('rcards');
let selRace=null;
for(const rk of raceKeys){
  const rd=RACES[rk];
  const d=document.createElement('div');
  d.className='rcard';
  d.innerHTML=`<h3 style="color:${rd.color}">${rd.name}</h3><p>${rd.desc}<br><span style="color:#3d2f6e">Pop: ${rd.pop} | Ess: ${rd.ess}</span></p>`;
  d.onclick=()=>{
    document.querySelectorAll('.rcard').forEach(c=>c.classList.remove('sel'));
    d.classList.add('sel');selRace=rk;
    // Pick random enemy race
    const others=raceKeys.filter(r=>r!==rk);
    G.er=others[Math.floor(Math.random()*others.length)];
    G.race=rk;
    document.getElementById('startBtn').disabled=false;
  };
  rcards.appendChild(d);
}
document.getElementById('startBtn').onclick=()=>{if(selRace)startGame();};
</script>
